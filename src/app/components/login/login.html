<div class="login-container">
    <div class="glass-panel">
        <div class="logo-container">
            <h1>Raíces</h1>
            <p>Portal Inmobiliario Exclusivo</p>
        </div>
        
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div *ngIf="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" formControlName="correo" class="form-control" placeholder="tu@correo.com">
                <small *ngIf="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched" class="text-danger">
                    Ingresa un correo válido.
                </small>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" class="form-control" placeholder="••••••••">
                <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger">
                    La contraseña es obligatoria.
                </small>
            </div>
            
            <button type="submit" class="btn-login" [disabled]="loginForm.invalid">Iniciar Sesión</button>
            
            <div class="extra-links">
                <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
                <a href="#">Regístrate</a>
            </div>
        </form>
    </div>
</div>
